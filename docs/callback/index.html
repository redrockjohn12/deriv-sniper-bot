<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Sniper Bot - OAuth</title>
</head>
<body>
    <p>Connecting Deriv Sniper Bot...</p>

    <script>
        const params = new URLSearchParams(window.location.search);

        const code = params.get("code");
        const state = params.get("state");
        const error = params.get("error");
        const errorDescription = params.get("error_description");

        if (error) {
            document.body.innerHTML =
                "<h3>Deriv authorization failed</h3><p>" +
                error +
                (errorDescription ? "<br><br>" + errorDescription : "") +
                "</p>";
        } else if (code && state) {
            const appUrl =
                "derivsniper://oauth/callback" +
                "?code=" + encodeURIComponent(code) +
                "&state=" + encodeURIComponent(state);

            window.location.href = appUrl;
        } else {
            document.body.innerHTML =
                "<h3>Waiting for Deriv authorization...</h3>";
        }
    </script>
</body>
</html>
